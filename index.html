<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090d16">
<meta name="description" content="Code Studio Pro — offline personal HTML tools and code workspace">
<link rel="manifest" href="./manifest.webmanifest">
<title>Code Studio Pro</title>
<style>
:root{color-scheme:dark;--bg:#090d16;--panel:#111827;--card:#151e30;--line:#273449;--muted:#94a3b8;--text:#f8fafc;--purple:#8b5cf6;--blue:#2563eb;--green:#059669;--amber:#d97706;--red:#e11d48}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at top,#1b1640 0,var(--bg) 62%);color:var(--text)}
body{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}
.shell{max-width:760px;margin:auto;padding:20px 16px 32px}
header{text-align:center;padding:10px 0 20px;border-bottom:1px solid var(--line)}
h1{font-size:clamp(26px,6vw,34px);margin:0;font-weight:900;letter-spacing:.2px;background:linear-gradient(90deg,#f472b6,#a78bfa,#60a5fa);color:transparent;background-clip:text}
.sub{font-size:12px;color:var(--muted);margin-top:5px}
.actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-top:18px}
.action{min-height:66px;border:1px solid #39445d;border-radius:16px;color:white;background:linear-gradient(145deg,#25314b,#151d2e);font-size:22px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;box-shadow:0 6px 20px #0003}
.action span{font-size:10px;color:#dbeafe;font-weight:650}.action:active,.tool:active{transform:scale(.97)}
.action.studio{grid-column:span 5;min-height:58px;flex-direction:row;background:linear-gradient(100deg,#6d28d9,#4338ca);font-size:20px}
.search{width:100%;margin-top:14px;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:#0b1220;color:white;outline:none}
.search:focus,.field:focus{border-color:var(--purple)}
.section{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px;color:#cbd5e1;font-size:13px;font-weight:750}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tool{border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#172238,#101827);min-height:116px;padding:15px 10px;color:white;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden}
.tool .emoji{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,#7c3aed,#2563eb);display:grid;place-items:center;font-size:23px}
.tool strong{font-size:12px;overflow-wrap:anywhere;line-height:1.4}
.empty{padding:36px 14px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;z-index:20;background:#020617ed;display:flex;align-items:center;justify-content:center;padding:14px}
.dialog{width:min(100%,520px);max-height:92dvh;overflow:auto;background:#111827;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 25px 80px #0009}
.dialog h2{font-size:18px;margin:0 0 14px}.field{display:block;width:100%;padding:12px;margin:9px 0;border:1px solid var(--line);border-radius:11px;background:#080f1c;color:white;outline:none;font-size:13px}
textarea.field{min-height:130px;resize:vertical;font-family:ui-monospace,monospace;direction:ltr;text-align:left}
.row{display:flex;gap:9px}.row>*{flex:1}
.btn{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:#263247;color:white;font-weight:700;font-size:12px}
.btn.primary{background:linear-gradient(100deg,#7c3aed,#4f46e5);border:0}.btn.danger{background:#4c1424;color:#fecdd3}
.modal-actions{display:flex;gap:9px;margin-top:12px}.modal-actions>*{flex:1}
#runner{position:fixed;inset:0;z-index:50;background:#fff;display:flex;flex-direction:column}
#runner iframe{border:0;width:100%;height:100%;flex:1;background:white}
.runbar{height:46px;flex:none;background:#111827;display:flex;align-items:center;justify-content:space-between;padding:0 10px;color:white}
.runbar button{background:#293449;color:white;border:0;border-radius:8px;padding:7px 12px;font-size:12px}
#studioHost{position:fixed;inset:0;z-index:60;background:#18181b}
#studioHost iframe{border:0;width:100%;height:100%;display:block}
#studioExit{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 8px);z-index:5;border:1px solid #ffffff35;background:#111827eF;color:white;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700}
.toast{position:fixed;z-index:100;bottom:25px;left:50%;transform:translateX(-50%);background:#25213a;border:1px solid #8b5cf6;color:white;padding:10px 15px;border-radius:18px;font-size:12px;max-width:90vw}
@media(max-width:420px){.shell{padding:15px 12px 28px}.actions{gap:7px}.action{min-height:60px}.tool{min-height:105px}}
</style>
</head>
<body>
<main class="shell" id="home">
<header><h1>Code Studio Pro</h1><div class="sub">Personal HTML Tools • Offline-first workspace</div>
<div class="actions">
<button class="action" onclick="openImportMenu()" aria-label="Import HTML">📁<span>Import</span></button>
<button class="action" onclick="openAdd()">➕<span>Add Code</span></button>
<button class="action" onclick="toggleSearch()">🔍<span>Search</span></button>
<button class="action" onclick="openNotes()">📝<span>Notepad</span></button>
<button class="action" onclick="exportBackup()">💾<span>Backup</span></button>
<button class="action studio" onclick="openStudio()">⚡ <b>Open Code Studio</b></button>
</div>
<input id="search" class="search hidden" placeholder="Search saved tools..." oninput="renderTools()">
<input id="bulk" type="file" accept=".html,.htm,text/html" multiple hidden onchange="importFiles(event)">
<input id="bulkFolder" type="file" accept=".html,.htm,text/html" multiple webkitdirectory directory hidden onchange="importFiles(event)">
<input id="restore" type="file" accept=".json,application/json" hidden onchange="restoreBackup(event)">
</header>
<div class="section"><span>MY HTML TOOLS</span><span id="count">0</span></div>
<div id="tools" class="grid"></div>
<div id="empty" class="empty hidden">No saved tools yet.<br>Import an HTML file or add code.</div>
</main>

<div id="importModal" class="overlay hidden"><section class="dialog">
<h2>📁 Import HTML</h2><p class="sub">Choose individual HTML files or select a folder containing HTML files.</p>
<div class="modal-actions"><button class="btn primary" type="button" onclick="chooseImportFiles()">Select HTML files</button><button class="btn" type="button" onclick="chooseImportFolder()">Select folder</button></div>
<div class="modal-actions"><button class="btn" type="button" onclick="closeImportMenu()">Cancel</button></div>
</section></div>

<div id="details" class="overlay hidden"><section class="dialog">
<h2 id="detailName">Tool</h2><p id="detailDesc" class="sub"></p>
<div class="modal-actions"><button class="btn primary" onclick="runSelected()">▶ Run Full Screen</button><button class="btn" onclick="editSelected()">Edit</button></div>
<div class="modal-actions"><button class="btn danger" onclick="deleteSelected()">Delete</button><button class="btn" onclick="closeDetails()">Close</button></div>
</section></div>

<div id="editorModal" class="overlay hidden"><section class="dialog">
<h2 id="editorTitle">Add HTML Tool</h2>
<input id="toolName" class="field" placeholder="Tool name">
<input id="toolDesc" class="field" placeholder="Short description (optional)">
<textarea id="toolCode" class="field" placeholder="Paste complete HTML code here" spellcheck="false"></textarea>
<div class="row"><input id="toolEmoji" class="field" placeholder="Emoji e.g. 🧮" value="🛠️"><select id="toolColor" class="field"><option>purple</option><option>blue</option><option>green</option><option>amber</option><option>pink</option></select></div>
<div class="modal-actions"><button class="btn" onclick="closeEditor()">Cancel</button><button class="btn primary" onclick="saveTool()">Save</button></div>
</section></div>

<div id="notesModal" class="overlay hidden"><section class="dialog">
<h2>📝 Quick Notepad</h2><textarea id="notes" class="field" style="height:45dvh" placeholder="Write notes here..." oninput="saveNotes()"></textarea>
<div class="modal-actions"><button class="btn" onclick="closeNotes()">Close</button><button class="btn primary" onclick="downloadNotes()">Download TXT</button></div>
</section></div>

<div id="runner" class="hidden"><div class="runbar"><span id="runTitle">HTML Tool</span><button onclick="closeRunner()">✕ Close Tool</button></div><iframe id="toolFrame" title="HTML tool preview" allow="fullscreen; clipboard-read; clipboard-write"></iframe></div>

<div id="studioHost" class="hidden"><button id="studioExit" onclick="closeStudio()">← Back to Code Studio Pro</button><iframe id="studioFrame" title="Code Studio workspace" allow="clipboard-read; clipboard-write; fullscreen"></iframe></div>
<div id="toast" class="toast hidden" role="status"></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
let db=null, tools=[], selectedId=null, editingId=null, toastTimer=null;
const STUDIO_HTML="\u003c!DOCTYPE html>\n\u003chtml lang=\"en\" dir=\"ltr\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\n\u003cmeta name=\"theme-color\" content=\"#18181b\">\n\u003ctitle>Code Studio Pro — Code Studio\u003c/title>\n\u003cstyle>\n  :root{--bg-main:#18181b;--bg-card:#242429;--bg-editor:#ffffff;--bg-pill:#2e2e36;--text-main:#f4f4f5;--text-muted:#a1a1aa;--border:#34343e;--accent-purple:#8b5cf6;--accent-blue:#3b82f6;--accent-green:#10b981;--accent-gold:#f59e0b;--danger:#ef4444}\n  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent}\n  html,body{height:100%}\n  body{background:var(--bg-main);color:var(--text-main);height:100dvh;overflow:hidden;display:flex;flex-direction:column;direction:ltr;text-align:left}\n  .view{display:none;flex-direction:column;height:100%;width:100%}\n  .view.active{display:flex}\n  .dash-header{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;background:var(--bg-card)}\n  .dash-header h1{font-size:1.25rem;font-weight:700;display:flex;align-items:center;gap:8px}\n  .dash-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}\n  .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n  .dash-btn{background:var(--bg-card);border:1px solid var(--border);color:var(--text-main);padding:16px 12px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:.9rem;font-weight:600;cursor:pointer;text-align:center}\n  .dash-btn:active{transform:scale(.98);background:var(--bg-pill)}\n  .dash-btn.primary{background:var(--accent-purple);border-color:var(--accent-purple);color:#fff}\n  .dash-btn svg{width:24px;height:24px}\n  .section-title{font-size:.85rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-top:8px;display:flex;justify-content:space-between;align-items:center}\n  .project-list{display:flex;flex-direction:column;gap:10px}\n  .project-item{background:var(--bg-card);border:1px solid var(--border);padding:14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center}\n  .project-info{flex:1;cursor:pointer;min-width:0}\n  .project-name{font-weight:600;font-size:1rem;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .project-meta{font-size:.75rem;color:var(--text-muted)}\n  .project-actions{display:flex;gap:8px;flex-shrink:0}\n  .icon-btn-sm{background:var(--bg-pill);border:none;color:var(--text-main);width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer}\n  .icon-btn-sm.del{color:var(--danger)}\n  .top-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg-main);gap:8px}\n  .top-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}\n  .back-btn{background:none;border:none;color:var(--text-main);padding:6px;cursor:pointer;display:flex;align-items:center}\n  .proj-title-input{background:transparent;border:none;color:var(--text-main);font-size:1.05rem;font-weight:700;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none;min-width:0}\n  .top-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}\n  .top-pill-btn{width:38px;height:38px;border-radius:10px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}\n  .btn-download{background:#3f3822;color:#eab308}\n  .btn-save{background:#1e3a2f;color:#22c55e}\n  .btn-run{background:var(--accent-purple);color:#fff}\n\n  .util-bar{display:flex;align-items:center;gap:8px;padding:4px 12px 10px}\n  .undo-redo-wrap{display:flex;gap:6px;flex:1.2}\n  .ur-btn{flex:1;height:36px;border-radius:10px;border:1px solid transparent;font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;padding:0 6px;transition:.15s}\n  .ur-btn.undo{background:rgba(245,158,11,.16);color:#fbbf24;border-color:rgba(245,158,11,.45)}\n  .ur-btn.redo{background:rgba(59,130,246,.16);color:#60a5fa;border-color:rgba(59,130,246,.45)}\n  .ur-btn:active{transform:scale(.97);opacity:.85}\n  .ur-badge{background:rgba(0,0,0,.35);padding:1px 5px;border-radius:8px;font-size:.7rem;font-weight:800;min-width:18px;text-align:center}\n\n  .util-group{display:flex;gap:6px}\n  .util-btn{background:var(--bg-pill);border:none;color:var(--text-main);height:36px;padding:0 10px;border-radius:10px;font-size:.78rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;white-space:nowrap}\n  .util-btn:active{opacity:.8}\n  .search-toggle-btn{height:36px;background:var(--bg-pill);border:1px solid var(--border);color:var(--text-main);border-radius:10px;font-size:.78rem;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:0 10px;white-space:nowrap}\n  .search-toggle-btn.active{border-color:var(--accent-purple);background:rgba(139,92,246,.18);color:#ddd6fe}\n\n  .tabs-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 12px 10px}\n  .tab-pill{background:var(--bg-pill);color:var(--text-muted);border:1px solid transparent;height:34px;border-radius:17px;font-size:.8rem;font-weight:700;cursor:pointer;transition:.15s}\n  .tab-pill[data-mod=\"head\"].active{background:var(--accent-purple);color:#fff}\n  .tab-pill[data-mod=\"css\"].active{background:var(--accent-blue);color:#fff}\n  .tab-pill[data-mod=\"html\"].active{background:var(--accent-green);color:#fff}\n  .tab-pill[data-mod=\"js\"].active{background:var(--accent-gold);color:#18181b}\n  .ai-strip{display:flex;align-items:center;justify-content:space-between;padding:5px 12px;background:var(--bg-card);border-top:1px solid var(--border);border-bottom:1px solid var(--border);gap:6px;flex-wrap:wrap}\n  .ai-strip-left{display:flex;gap:6px;align-items:center;flex-wrap:wrap}\n  .ai-btn{background:var(--bg-pill);color:var(--text-main);border:1px solid var(--border);padding:5px 10px;border-radius:8px;font-size:.75rem;font-weight:600;display:flex;align-items:center;gap:5px;cursor:pointer}\n  .ai-btn.copy{border-color:var(--accent-blue);color:#93c5fd}\n  .ai-btn.replace{border-color:var(--accent-green);color:#6ee7b7}\n  .ai-btn.diff{border-color:var(--accent-gold);color:#fcd34d}\n  .auto-run-label{display:flex;align-items:center;gap:5px;font-size:.75rem;color:var(--text-muted);cursor:pointer}\n\n  .search-panel{display:none;flex-direction:column;background:var(--bg-card);padding:10px 12px;border-bottom:1px solid var(--border);gap:8px}\n  .search-panel.open{display:flex}\n  .search-row{display:flex;gap:6px;width:100%}\n  .search-input{flex:1;min-width:0;background:var(--bg-main);border:1px solid var(--border);color:var(--text-main);padding:9px 11px;border-radius:9px;font-size:.85rem;font-family:monospace;direction:ltr;text-align:left;outline:none}\n  .search-input:focus{border-color:var(--accent-purple)}\n  .search-actions-row{display:flex;gap:6px;justify-content:space-between;align-items:center}\n  .search-btn-group{display:flex;gap:6px;flex:1}\n  .s-act-btn{flex:1;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg-pill);color:var(--text-main);font-size:.78rem;font-weight:600;cursor:pointer;text-align:center}\n  .s-act-btn.rep{background:rgba(16,185,129,.18);border-color:var(--accent-green);color:#6ee7b7}\n  .s-act-btn.expand{background:rgba(139,92,246,.2);border-color:var(--accent-purple);color:#ddd6fe;flex:0 0 auto;padding:7px 12px}\n  .s-act-btn.matches{background:rgba(59,130,246,.18);border-color:var(--accent-blue);color:#93c5fd}\n\n  .match-list{display:none;flex-direction:column;gap:8px;max-height:38vh;overflow-y:auto;padding:4px 0}\n  .match-list.open{display:flex}\n  .match-card{background:var(--bg-main);border:1px solid var(--border);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}\n  .match-card.active{border-color:var(--accent-purple);background:rgba(139,92,246,.08)}\n  .match-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}\n  .match-line-badge{background:rgba(139,92,246,.22);color:#ddd6fe;padding:2px 8px;border-radius:8px;font-size:.72rem;font-weight:700;font-family:monospace}\n  .match-actions{display:flex;gap:5px;flex-wrap:wrap}\n  .match-mini-btn{background:var(--bg-pill);border:1px solid var(--border);color:var(--text-main);padding:3px 8px;border-radius:6px;font-size:.7rem;font-weight:600;cursor:pointer}\n  .match-mini-btn.go{border-color:var(--accent-blue);color:#93c5fd}\n  .match-mini-btn.cp{border-color:var(--accent-gold);color:#fcd34d}\n  .match-mini-btn.rp{border-color:var(--accent-green);color:#6ee7b7}\n  .match-mini-btn.dl{border-color:var(--danger);color:#fca5a5}\n  .match-preview{font-family:monospace;font-size:11.5px;color:#cbd5e1;background:#0f0f12;padding:6px 8px;border-radius:6px;white-space:pre-wrap;word-break:break-word;max-height:100px;overflow-y:auto;direction:ltr;text-align:left;line-height:1.4;border-left:3px solid var(--accent-purple)}\n  .match-replace-row{display:flex;gap:5px;align-items:center;margin-top:2px}\n  .match-replace-input{flex:1;background:var(--bg-main);border:1px solid var(--border);color:var(--text-main);padding:5px 8px;border-radius:6px;font-size:.75rem;font-family:monospace;outline:none;min-width:0}\n  .match-replace-input:focus{border-color:var(--accent-green)}\n  .match-count-banner{font-size:.75rem;color:var(--text-muted);padding:4px 0;display:flex;justify-content:space-between;align-items:center}\n  .match-count-banner strong{color:var(--accent-purple)}\n\n  .editor-wrapper{flex:1;display:flex;width:calc(100% - 24px);background:#ffffff;margin:8px 12px;border-radius:12px;border:1px solid var(--border);overflow:hidden;position:relative;min-height:120px}\n  .line-numbers{width:44px;flex-shrink:0;background:#f1f5f9;color:#64748b;font-family:\"Fira Code\",\"Consolas\",monospace;font-size:13px;line-height:1.55;padding:12px 6px;text-align:right;user-select:none;overflow:hidden;border-right:1px solid #e2e8f0;white-space:pre;direction:ltr;cursor:pointer}\n  .code-stage{flex:1;position:relative;overflow:hidden;background:#ffffff;min-width:0;height:100%}\n  .code-highlight-layer,.code-editor{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:12px;border:none;outline:none;font-family:\"Fira Code\",\"Consolas\",monospace;font-size:13px;line-height:1.55;letter-spacing:0;tab-size:2;white-space:pre;overflow:auto;direction:ltr;text-align:left;unicode-bidi:isolate;word-wrap:normal;overflow-wrap:normal}\n  .code-highlight-layer{z-index:1;pointer-events:none;color:#1e293b;background:transparent}\n  .code-editor{z-index:2;resize:none;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:#0f172a}\n  .code-editor::selection{background:rgba(59,130,246,.25);color:transparent}\n  .search-hl{background:rgba(245,158,11,.4);border-radius:2px;color:transparent}\n  .search-hl.current{background:rgba(139,92,246,.6)}\n\n  .tok-tag{color:#0550ae;font-weight:600}\n  .tok-attr{color:#953800}\n  .tok-str{color:#0a3069}\n  .tok-comm{color:#6e7781;font-style:italic}\n  .tok-kw{color:#cf222e;font-weight:600}\n  .tok-num{color:#0550ae}\n  .tok-prop{color:#8250df}\n\n  .parts-action-bar{display:grid;grid-template-columns:1fr 1fr;background:var(--bg-card);padding:6px 12px;gap:8px;border-top:1px solid var(--border)}\n  .part-action-btn{background:var(--bg-pill);color:var(--text-main);border:1px solid var(--border);height:34px;padding:0 10px;border-radius:8px;font-size:.78rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;white-space:nowrap}\n  .part-action-btn.copy-mod{border-color:var(--accent-blue);color:#93c5fd}\n  .part-action-btn.rep-mod{border-color:var(--accent-green);color:#6ee7b7}\n  .part-action-btn:active{opacity:.8}\n\n  .runner-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg-card);border-bottom:1px solid var(--border);gap:8px;flex-wrap:wrap}\n  .runner-actions{display:flex;gap:8px}\n  .run-ctrl-btn{background:var(--bg-pill);color:var(--text-main);border:1px solid var(--border);padding:6px 12px;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px}\n  .preview-frame{flex:1;width:100%;border:none;background:#fff;min-height:100px}\n  .console-box{background:#121215;border-top:1px solid var(--border);display:flex;flex-direction:column;max-height:35vh}\n  .console-header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--bg-card);font-size:.8rem}\n  .console-badges{display:flex;gap:8px;align-items:center;cursor:pointer}\n  .badge{padding:2px 7px;border-radius:10px;font-size:.72rem;font-weight:700}\n  .badge.err{background:rgba(239,68,68,.2);color:#fca5a5}\n  .badge.warn{background:rgba(245,158,11,.2);color:#fcd34d}\n  .badge.log{background:rgba(59,130,246,.2);color:#93c5fd}\n  .console-actions-group{display:flex;gap:6px}\n  .console-logs{overflow-y:auto;padding:8px 12px;font-family:monospace;font-size:12px;display:flex;flex-direction:column;gap:4px;height:130px;direction:ltr;text-align:left}\n  .console-box.collapsed .console-logs{display:none}\n  .log-line{padding:4px 6px;border-radius:4px;word-break:break-word;border-left:3px solid transparent;direction:ltr;text-align:left;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}\n  .log-line-content{flex:1;overflow-wrap:break-word}\n  .log-copy-btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:inherit;cursor:pointer;font-size:.72rem;padding:2px 7px;border-radius:5px;flex-shrink:0;font-weight:600}\n  .log-copy-btn:active{opacity:.7}\n  .log-line.error{background:rgba(239,68,68,.12);color:#fca5a5;border-color:#ef4444}\n  .log-line.warn{background:rgba(245,158,11,.12);color:#fcd34d;border-color:#f59e0b}\n  .log-line.info{background:rgba(16,185,129,.12);color:#6ee7b7;border-color:#10b981}\n  .log-line.log{background:rgba(59,130,246,.1);color:#93c5fd;border-color:#3b82f6}\n\n  .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;align-items:center;justify-content:center;padding:14px}\n  .modal-backdrop.open{display:flex}\n  .modal-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}\n  .modal-card.wide{max-width:680px}\n  .modal-head{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:10px}\n  .modal-body{padding:14px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}\n  .modal-foot{padding:11px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}\n  .modal-textarea{width:100%;height:210px;background:var(--bg-main);border:1px solid var(--border);color:var(--text-main);border-radius:10px;padding:10px;font-family:monospace;font-size:12.5px;line-height:1.45;resize:vertical;min-height:110px;direction:ltr;text-align:left;unicode-bidi:plaintext;outline:none}\n  .modal-textarea:focus{border-color:var(--accent-purple)}\n  .field-label{font-size:.78rem;color:var(--text-muted);font-weight:600;margin-bottom:-4px}\n  .btn-solid{background:var(--accent-purple);color:#fff;border:none;padding:9px 16px;border-radius:10px;font-weight:600;cursor:pointer}\n  .btn-ghost{background:var(--bg-pill);color:var(--text-main);border:none;padding:9px 16px;border-radius:10px;font-weight:600;cursor:pointer}\n  .diff-box{font-family:monospace;font-size:12px;background:var(--bg-main);padding:10px;border-radius:8px;max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word;direction:ltr;text-align:left}\n  .diff-add{background:rgba(16,185,129,.2);color:#6ee7b7;display:block}\n  .diff-rem{background:rgba(239,68,68,.2);color:#fca5a5;display:block}\n  .diff-eq{color:var(--text-muted);display:block}\n  .toast{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);background:#27272a;color:#fff;border:1px solid var(--accent-purple);padding:8px 16px;border-radius:20px;font-size:.85rem;font-weight:600;z-index:10000;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}\n  .toast.show{opacity:1}\n  @media(max-width:480px){.action-grid{grid-template-columns:1fr}.dash-header h1{font-size:1rem}.tabs-bar{gap:4px;padding:0 8px 8px}.tab-pill{font-size:.72rem;height:31px}.editor-wrapper{width:calc(100% - 16px);margin:6px 8px}.ai-strip{padding:4px 8px}.ai-btn{font-size:.72rem;padding:4px 8px}.ur-btn{font-size:.76rem;padding:0 6px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv id=\"view-dashboard\" class=\"view active\">\n  \u003cdiv class=\"dash-header\">\n    \u003ch1>⚡ Code Studio\u003c/h1>\n    \u003cdiv style=\"display:flex;align-items:center;gap:10px;\">\n      \u003cspan id=\"save-status\" style=\"font-size:0.75rem;color:var(--text-muted);\">Synced\u003c/span>\n      \u003cbutton class=\"util-btn\" onclick=\"exportAllBackup()\" title=\"Backup All\">💾 Backup\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"dash-body\">\n    \u003cdiv class=\"action-grid\">\n      \u003cbutton class=\"dash-btn primary\" onclick=\"triggerFileImport()\">\n        \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003cpath d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"/>\u003cpolyline points=\"17 8 12 3 7 8\"/>\u003cline x1=\"12\" y1=\"3\" x2=\"12\" y2=\"15\"/>\u003c/svg>\n        Import HTML File\n      \u003c/button>\n      \u003cbutton class=\"dash-btn\" onclick=\"openPasteFullModal()\">\n        \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003cpath d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\"/>\u003crect x=\"8\" y=\"2\" width=\"8\" height=\"4\" rx=\"1\" ry=\"1\"/>\u003c/svg>\n        Paste Full HTML\n      \u003c/button>\n      \u003cbutton class=\"dash-btn\" onclick=\"createBlankProject()\">\n        \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003cline x1=\"12\" y1=\"5\" x2=\"12\" y2=\"19\"/>\u003cline x1=\"5\" y1=\"12\" x2=\"19\" y2=\"12\"/>\u003c/svg>\n        New Blank Project\n      \u003c/button>\n      \u003cbutton class=\"dash-btn\" onclick=\"triggerBackupRestore()\">\n        \u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\">\u003cpolyline points=\"1 4 1 10 7 10\"/>\u003cpath d=\"M3.51 15a9 9 0 1 0 2.13-9.36L1 10\"/>\u003c/svg>\n        Restore Backup\n      \u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"section-title\">\u003cspan>Saved Projects\u003c/span>\u003cspan id=\"project-count\">0\u003c/span>\u003c/div>\n    \u003cdiv id=\"project-list\" class=\"project-list\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"view-editor\" class=\"view\">\n  \u003cdiv class=\"top-bar\">\n    \u003cdiv class=\"top-left\">\n      \u003cbutton class=\"back-btn\" onclick=\"goDashboard()\" title=\"Dashboard\">\n        \u003csvg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\">\u003cline x1=\"19\" y1=\"12\" x2=\"5\" y2=\"12\"/>\u003cpolyline points=\"12 19 5 12 12 5\"/>\u003c/svg>\n      \u003c/button>\n      \u003cinput type=\"text\" id=\"editor-proj-name\" class=\"proj-title-input\" value=\"Untitled App\" onchange=\"renameCurrentProject(this.value)\">\n    \u003c/div>\n    \u003cdiv class=\"top-actions\">\n      \u003cbutton class=\"top-pill-btn btn-download\" onclick=\"openExportModal()\" title=\"Export HTML\">\n        \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\">\u003cpath d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"/>\u003cpolyline points=\"7 10 12 15 17 10\"/>\u003cline x1=\"12\" y1=\"15\" x2=\"12\" y2=\"3\"/>\u003c/svg>\n      \u003c/button>\n      \u003cbutton class=\"top-pill-btn btn-save\" onclick=\"saveCurrentProject(true)\" title=\"Save\">\n        \u003csvg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\">\u003cpath d=\"M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z\"/>\u003cpolyline points=\"17 21 17 13 7 13 7 21\"/>\u003cpolyline points=\"7 3 7 8 15 8\"/>\u003c/svg>\n      \u003c/button>\n      \u003cbutton class=\"top-pill-btn btn-run\" onclick=\"runCode(true)\" title=\"Live Run\">\n        \u003csvg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\">\u003cpath d=\"M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"3\"/>\u003c/svg>\n      \u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"util-bar\">\n    \u003cdiv class=\"undo-redo-wrap\">\n      \u003cbutton class=\"ur-btn undo\" onclick=\"editorUndo()\" title=\"Undo\">\n        ↩ \u003cspan id=\"undo-count\" class=\"ur-badge\">0\u003c/span>\n      \u003c/button>\n      \u003cbutton class=\"ur-btn redo\" onclick=\"editorRedo()\" title=\"Redo\">\n        ↪ \u003cspan id=\"redo-count\" class=\"ur-badge\">0\u003c/span>\n      \u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"util-group\">\n      \u003cbutton class=\"util-btn\" onclick=\"formatCurrentModule()\" title=\"Clean / Format Code\">✨ Clean\u003c/button>\n      \u003clabel class=\"util-btn\" style=\"cursor:pointer;\" title=\"Color Picker\">🎨 Color\u003cinput type=\"color\" id=\"color-picker\" style=\"width:0;height:0;opacity:0;position:absolute;\" onchange=\"insertColor(this.value)\">\u003c/label>\n    \u003c/div>\n    \u003cbutton id=\"search-toggle-btn\" class=\"search-toggle-btn\" onclick=\"toggleSearchPanel()\">🔍 Search\u003c/button>\n  \u003c/div>\n\n  \u003cdiv id=\"search-panel\" class=\"search-panel\">\n    \u003cdiv class=\"search-row\">\n      \u003cinput type=\"text\" id=\"find-input\" class=\"search-input\" placeholder=\"Find code or text...\" oninput=\"debouncedRefreshMatches()\">\n      \u003cinput type=\"text\" id=\"replace-input\" class=\"search-input\" placeholder=\"Replace with...\">\n    \u003c/div>\n    \u003cdiv class=\"search-actions-row\">\n      \u003cdiv class=\"search-btn-group\">\n        \u003cbutton class=\"s-act-btn\" onclick=\"findNext()\">Find Next\u003c/button>\n        \u003cbutton class=\"s-act-btn rep\" onclick=\"replaceAllInModule()\">Replace All\u003c/button>\n        \u003cbutton class=\"s-act-btn matches\" onclick=\"toggleMatchList()\">📋 Matches\u003c/button>\n      \u003c/div>\n      \u003cbutton class=\"s-act-btn expand\" onclick=\"openExpandedSearchModal()\" title=\"Open Multi-line Search & Replace Window\">⤢ Multi-Line\u003c/button>\n    \u003c/div>\n    \u003cdiv id=\"match-list\" class=\"match-list\">\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"tabs-bar\">\n    \u003cbutton class=\"tab-pill\" data-mod=\"head\" onclick=\"switchModule('head')\">HEAD\u003c/button>\n    \u003cbutton class=\"tab-pill\" data-mod=\"css\" onclick=\"switchModule('css')\">CSS\u003c/button>\n    \u003cbutton class=\"tab-pill active\" data-mod=\"html\" onclick=\"switchModule('html')\">HTML\u003c/button>\n    \u003cbutton class=\"tab-pill\" data-mod=\"js\" onclick=\"switchModule('js')\">JS\u003c/button>\n  \u003c/div>\n  \u003cdiv class=\"ai-strip\">\n    \u003cdiv class=\"ai-strip-left\">\n      \u003clabel class=\"auto-run-label\">\u003cinput type=\"checkbox\" id=\"auto-run-chk\" checked> Auto Run\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"ai-strip-left\">\n      \u003cbutton class=\"ai-btn diff\" onclick=\"showDiffModal()\">⚖️ Diff\u003c/button>\n      \u003cbutton class=\"ai-btn\" onclick=\"openHistoryModal()\">🕒 History\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"editor-wrapper\">\n    \u003cdiv id=\"line-numbers\" class=\"line-numbers\">1\u003c/div>\n    \u003cdiv class=\"code-stage\">\n      \u003cpre id=\"code-highlight\" class=\"code-highlight-layer\" aria-hidden=\"true\">\u003c/pre>\n      \u003ctextarea id=\"code-editor\" class=\"code-editor\" spellcheck=\"false\" autocapitalize=\"off\" autocomplete=\"off\" autocorrect=\"off\">\u003c/textarea>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"parts-action-bar\">\n    \u003cbutton class=\"part-action-btn copy-mod\" onclick=\"copyCurrentModule()\">\n      📋 Copy \u003cspan id=\"lbl-mod-copy\">HTML\u003c/span>\n    \u003c/button>\n    \u003cbutton class=\"part-action-btn rep-mod\" onclick=\"openModuleReplaceModal()\">\n      🔄 Paste / Replace \u003cspan id=\"lbl-mod-rep\">HTML\u003c/span>\n    \u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"view-runner\" class=\"view\">\n  \u003cdiv class=\"runner-bar\">\n    \u003cdiv class=\"runner-actions\">\n      \u003cbutton class=\"run-ctrl-btn\" onclick=\"backToEditor()\">⬅️ Editor\u003c/button>\n      \u003cbutton class=\"run-ctrl-btn\" onclick=\"goDashboard()\">🏠 Dashboard\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"runner-actions\">\n      \u003cbutton class=\"run-ctrl-btn\" style=\"border-color:var(--accent-purple);\" onclick=\"runCode(true)\">🔄 Rerun\u003c/button>\n    \u003c/div>\n  \u003c/div>\n  \u003ciframe id=\"preview-frame\" class=\"preview-frame\" sandbox=\"allow-scripts allow-forms allow-modals allow-popups\">\u003c/iframe>\n  \u003cdiv id=\"console-box\" class=\"console-box\">\n    \u003cdiv class=\"console-header\">\n      \u003cdiv class=\"console-badges\" onclick=\"toggleConsole()\">\n        \u003cstrong>Console\u003c/strong>\n        \u003cspan id=\"err-count\" class=\"badge err\">0 Errors\u003c/span>\n        \u003cspan id=\"warn-count\" class=\"badge warn\">0 Warnings\u003c/span>\n        \u003cspan id=\"log-count\" class=\"badge log\">0 Logs\u003c/span>\n      \u003c/div>\n      \u003cdiv class=\"console-actions-group\">\n        \u003cbutton class=\"ai-btn\" onclick=\"copyAllErrors()\" title=\"Copy all console errors/logs\">📋 Copy All\u003c/button>\n        \u003cbutton class=\"ai-btn\" onclick=\"clearConsole()\">Clear\u003c/button>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv id=\"console-logs\" class=\"console-logs\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cinput type=\"file\" id=\"html-file-input\" accept=\".html,.htm,.txt\" style=\"display:none\" onchange=\"handleHtmlFileUpload(event)\">\n\u003cinput type=\"file\" id=\"backup-file-input\" accept=\".json\" style=\"display:none\" onchange=\"handleBackupUpload(event)\">\n\n\u003cdiv id=\"modal-big-search\" class=\"modal-backdrop\">\n  \u003cdiv class=\"modal-card wide\">\n    \u003cdiv class=\"modal-head\">\n      \u003cspan>⤢ Multi-Line Find & Replace (\u003cstrong id=\"big-search-mod\">HTML\u003c/strong>)\u003c/span>\n      \u003cbutton class=\"icon-btn-sm\" onclick=\"closeExpandedSearchModal()\">✕\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"modal-body\">\n      \u003cdiv class=\"field-label\">Find Multi-line Text / Code:\u003c/div>\n      \u003ctextarea id=\"big-find-area\" class=\"modal-textarea\" style=\"height:145px;\" placeholder=\"Paste or type multiple lines to find...\">\u003c/textarea>\n      \u003cdiv class=\"field-label\">Replace With:\u003c/div>\n      \u003ctextarea id=\"big-replace-area\" class=\"modal-textarea\" style=\"height:145px;\" placeholder=\"Paste or type replacement lines...\">\u003c/textarea>\n      \u003cdiv id=\"big-search-info\" style=\"font-size:.8rem;color:var(--text-muted);\">\u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"modal-foot\">\n      \u003cbutton class=\"btn-ghost\" onclick=\"closeExpandedSearchModal()\">⬅️ Back to Bar\u003c/button>\n      \u003cbutton class=\"btn-solid\" style=\"background:var(--accent-blue);color:#fff;\" onclick=\"previewBigSearchMatches()\">🔍 Preview Matches\u003c/button>\n      \u003cbutton class=\"btn-solid\" style=\"background:var(--accent-green);color:#09090b;\" onclick=\"applyExpandedReplace()\">Replace All & Return\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"modal-paste-full\" class=\"modal-backdrop\">\n  \u003cdiv class=\"modal-card\">\n    \u003cdiv class=\"modal-head\">\u003cspan>Paste Full HTML Code\u003c/span>\u003cbutton class=\"icon-btn-sm\" onclick=\"closeModal('modal-paste-full')\">✕\u003c/button>\u003c/div>\n    \u003cdiv class=\"modal-body\">\n      \u003cinput type=\"text\" id=\"new-proj-name\" class=\"search-input\" placeholder=\"Project Name\" style=\"direction:ltr;text-align:left\">\n      \u003ctextarea id=\"full-html-paste-area\" class=\"modal-textarea\" placeholder=\"Paste full HTML code here...\">\u003c/textarea>\n    \u003c/div>\n    \u003cdiv class=\"modal-foot\">\n      \u003cbutton class=\"btn-ghost\" onclick=\"closeModal('modal-paste-full')\">Cancel\u003c/button>\n      \u003cbutton class=\"btn-solid\" onclick=\"importFromPastedFullHtml()\">Split & Load\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"modal-replace-mod\" class=\"modal-backdrop\">\n  \u003cdiv class=\"modal-card\">\n    \u003cdiv class=\"modal-head\">\u003cspan>Paste / Replace \u003cstrong id=\"modal-mod-title\">HTML\u003c/strong> Part\u003c/span>\u003cbutton class=\"icon-btn-sm\" onclick=\"closeModal('modal-replace-mod')\">✕\u003c/button>\u003c/div>\n    \u003cdiv class=\"modal-body\">\n      \u003cp style=\"font-size:.8rem;color:var(--text-muted);\">Paste your updated part code below:\u003c/p>\n      \u003ctextarea id=\"module-replace-area\" class=\"modal-textarea\" placeholder=\"Paste part code here...\">\u003c/textarea>\n    \u003c/div>\n    \u003cdiv class=\"modal-foot\">\n      \u003cbutton class=\"btn-ghost\" onclick=\"closeModal('modal-replace-mod')\">Cancel\u003c/button>\n      \u003cbutton class=\"btn-solid\" onclick=\"applyModuleReplacement()\">Apply Part\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"modal-export\" class=\"modal-backdrop\">\n  \u003cdiv class=\"modal-card\">\n    \u003cdiv class=\"modal-head\">\u003cspan>Export Complete HTML\u003c/span>\u003cbutton class=\"icon-btn-sm\" onclick=\"closeModal('modal-export')\">✕\u003c/button>\u003c/div>\n    \u003cdiv class=\"modal-body\">\n      \u003cbutton class=\"btn-solid\" onclick=\"downloadHTML()\">⬇️ Download File\u003c/button>\n      \u003cbutton class=\"btn-ghost\" onclick=\"copyCompleteHtml()\">📋 Copy Full Code\u003c/button>\n      \u003cbutton class=\"btn-ghost\" onclick=\"openInNewTab()\">🌐 Open in New Tab\u003c/button>\n    \u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"modal-history\" class=\"modal-backdrop\">\n  \u003cdiv class=\"modal-card\">\n    \u003cdiv class=\"modal-head\">\u003cspan>Version History\u003c/span>\u003cbutton class=\"icon-btn-sm\" onclick=\"closeModal('modal-history')\">✕\u003c/button>\u003c/div>\n    \u003cdiv class=\"modal-body\" id=\"history-list\">\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"modal-diff\" class=\"modal-backdrop\">\n  \u003cdiv class=\"modal-card\">\n    \u003cdiv class=\"modal-head\">\u003cspan>Code Diff (previous save vs current)\u003c/span>\u003cbutton class=\"icon-btn-sm\" onclick=\"closeModal('modal-diff')\">✕\u003c/button>\u003c/div>\n    \u003cdiv class=\"modal-body\">\u003cdiv id=\"diff-output\" class=\"diff-box\">\u003c/div>\u003c/div>\n  \u003c/div>\n\u003c/div>\n\n\u003cdiv id=\"toast\" class=\"toast\">Saved!\u003c/div>\n\n\u003cscript>\n'use strict';\n\nconst STORAGE_KEY = 'ai_code_studio_projects_v11';\nlet projects = [];\nlet currentProject = null;\nlet activeModule = 'html';\nlet undoStack = { head:[], css:[], html:[], js:[] };\nlet redoStack = { head:[], css:[], html:[], js:[] };\nlet errCounter = 0, warnCounter = 0, logCounter = 0;\nlet consoleMessagesList = [];\nlet allLogsEver = [];           // FIX 7: never cleared by clearConsole\nlet lastSavedSnapshot = null;   // FIX 4: track last save for diff baseline\n\nlet savedDocMeta = { doctype:'\u003c!DOCTYPE html>', htmlAttrs:'', bodyAttrs:'' };\nlet savedScriptAttrs = [];\nlet savedCssStyles = [];\n\n// FIX 1: boolean attributes whitelist\nconst BOOL_ATTRS = new Set(['async','defer','nomodule','crossorigin','integrity','reversed','disabled','checked','readonly','required','multiple','autofocus','novalidate','formnovalidate','hidden']);\n\n// Search state\nlet matchList = [];\nlet activeMatchIndex = -1;\nlet searchDebounceTimer = null;\nlet renderDebounceTimer = null;\nlet autoSaveDebounceTimer = null;\nlet lastSnapshotTime = 0;\nlet isRenderingHL = false;\nlet autoRunTimer = null;\n\nfunction $(id){ return document.getElementById(id); }\nfunction showToast(msg){\n  const t = $('toast'); t.textContent = msg; t.classList.add('show');\n  clearTimeout(showToast._tid);\n  showToast._tid = setTimeout(() => t.classList.remove('show'), 2200);\n}\nfunction updateSaveIndicator(statusText){\n  const ind = $('save-status');\n  if (ind) ind.textContent = statusText;\n}\n\nfunction escapeHtml(str){\n  return String(str == null ? '' : str)\n    .replace(/&/g, '&amp;')\n    .replace(/\u003c/g, '&lt;')\n    .replace(/>/g, '&gt;')\n    .replace(/\"/g, '&quot;')\n    .replace(/'/g, '&#39;');\n}\nfunction switchView(id){\n  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));\n  const el = $(id); if (el) el.classList.add('active');\n}\nfunction openModal(id){ const el = $(id); if (el) el.classList.add('open'); }\nfunction closeModal(id){ const el = $(id); if (el) el.classList.remove('open'); }\n\nfunction loadProjectsFromStorage(){\n  try {\n    const raw = localStorage.getItem(STORAGE_KEY)\n      || localStorage.getItem('ai_code_studio_projects_v10')\n      || localStorage.getItem('ai_code_studio_projects_v9')\n      || localStorage.getItem('ai_code_studio_projects_v8');\n    projects = raw ? JSON.parse(raw) : [];\n    if (!Array.isArray(projects)) projects = [];\n  } catch(e){ projects = []; }\n}\nfunction saveProjectsToStorage(){\n  try {\n    updateSaveIndicator('Saving...');\n    localStorage.setItem(STORAGE_KEY, JSON.stringify(projects));\n    setTimeout(() => updateSaveIndicator('Saved'), 400);\n  }\n  catch(e){\n    console.error(e);\n    updateSaveIndicator('Error');\n    showToast('Storage error: ' + e.message);\n  }\n}\n\n/* ============ SYNTAX HIGHLIGHTING ============ */\nfunction highlightSyntax(code, mod){\n  if (!code) return '\\n';\n  let escaped = escapeHtml(code);\n\n  if (mod === 'html' || mod === 'head') {\n    escaped = escaped.replace(/(&lt;!--[\\s\\S]*?--&gt;)/g, '\u003cspan class=\"tok-comm\">$1\u003c/span>');\n    escaped = escaped.replace(/(&lt;\\/?)([a-zA-Z0-9-]+)([\\s\\S]*?)(\\/?&gt;)/g, function(_, open, tag, attrs, close){\n      const styledAttrs = attrs.replace(\n        /([a-zA-Z0-9-:@]+)(=)(&quot;.*?&quot;|&#39;.*?&#39;)/g,\n        '\u003cspan class=\"tok-attr\">$1\u003c/span>$2\u003cspan class=\"tok-str\">$3\u003c/span>'\n      );\n      return `\u003cspan class=\"tok-tag\">${open}${tag}\u003c/span>${styledAttrs}\u003cspan class=\"tok-tag\">${close}\u003c/span>`;\n    });\n  } else if (mod === 'css') {\n    escaped = escaped.replace(/(\\/\\*[\\s\\S]*?\\*\\/)/g, '\u003cspan class=\"tok-comm\">$1\u003c/span>');\n    escaped = escaped.replace(/(@[a-zA-Z-]+)/g, '\u003cspan class=\"tok-kw\">$1\u003c/span>');\n    escaped = escaped.replace(/([a-zA-Z-]+)(\\s*:)/g, '\u003cspan class=\"tok-prop\">$1\u003c/span>$2');\n    escaped = escaped.replace(/(#[0-9a-fA-F]{3,8}\\b|\\b\\d+(?:px|rem|em|%|vh|vw|s|ms)?\\b)/g, '\u003cspan class=\"tok-num\">$1\u003c/span>');\n    escaped = escaped.replace(/(&quot;.*?&quot;|&#39;.*?&#39;)/g, '\u003cspan class=\"tok-str\">$1\u003c/span>');\n  } else if (mod === 'js') {\n    escaped = escaped.replace(/(\\/\\/.*$|\\/\\*[\\s\\S]*?\\*\\/)/gm, '\u003cspan class=\"tok-comm\">$1\u003c/span>');\n    escaped = escaped.replace(/`[\\s\\S]*?`/g, function(match) {\n      const inner = match.replace(/(\\$\\{[^}]*\\})/g,\n        '\u003c/span>\u003cspan class=\"tok-prop\">$1\u003c/span>\u003cspan class=\"tok-str\">');\n      return '\u003cspan class=\"tok-str\">' + inner + '\u003c/span>';\n    });\n    escaped = escaped.replace(/(&quot;(?:\\\\.|[^&])*?&quot;|&#39;(?:\\\\.|[^&])*?&#39;)/g, '\u003cspan class=\"tok-str\">$1\u003c/span>');\n    escaped = escaped.replace(/\\b(const|let|var|function|return|if|else|for|while|switch|case|break|new|try|catch|async|await|class|true|false|null|undefined|typeof|instanceof|of|in|do|this|super|extends|import|export|default|from|yield|delete|void)\\b/g, '\u003cspan class=\"tok-kw\">$1\u003c/span>');\n    escaped = escaped.replace(/\\b(\\d+(?:\\.\\d+)?)\\b/g, '\u003cspan class=\"tok-num\">$1\u003c/span>');\n  }\n\n  return escaped + (code.endsWith('\\n') ? ' ' : '');\n}\n\n// FIX 3: apply search highlight overlay to the highlighted layer\nfunction applySearchHighlightToLayer(html, query){\n  if (!query || matchList.length === 0) return html;\n  // Work on plain text (already escaped). We must re-escape query for matching.\n  const escQuery = escapeHtml(query);\n  if (!escQuery) return html;\n  // Only highlight exact occurrences in the rendered string. Best-effort without breaking tags:\n  // We highlight only on text nodes - simple approach: replace occurrences that are NOT inside \u003cspan...> tags.\n  // Since matchList ranges are on RAW text, we instead find and wrap by re-scanning escaped string carefully.\n  // For correctness we rebuild: mark segments from raw, escape, wrap, then re-run tokenization is complex.\n  // Pragmatic solution: highlight on the plain (escaped) string but skip inside attribute values.\n  let out = '';\n  let i = 0;\n  let hlIdx = 0;\n  while (i \u003c html.length) {\n    const open = html.indexOf('\u003cspan', i);\n    const close = html.indexOf('\u003c/span>', i);\n    let nextTag = open === -1 ? (close === -1 ? html.length : close) : (close === -1 ? open : Math.min(open, close));\n    const text = html.substring(i, nextTag);\n    // Highlight occurrences of escQuery in the text chunk\n    let startPos = 0;\n    let idx;\n    while ((idx = text.indexOf(escQuery, startPos)) !== -1) {\n      out += text.substring(startPos, idx);\n      const isCurrent = hlIdx === activeMatchIndex;\n      out += `\u003cspan class=\"search-hl${isCurrent ? ' current' : ''}\">${escQuery}\u003c/span>`;\n      startPos = idx + escQuery.length;\n      hlIdx++;\n    }\n    out += text.substring(startPos);\n    if (nextTag \u003c html.length) {\n      const tagEnd = html.indexOf('>', nextTag) + 1;\n      out += html.substring(nextTag, tagEnd);\n      i = tagEnd;\n    } else {\n      i = html.length;\n    }\n  }\n  return out;\n}\n\nfunction renderEditorSyntax(){\n  if (renderDebounceTimer) clearTimeout(renderDebounceTimer);\n  renderDebounceTimer = setTimeout(() => {\n    if (isRenderingHL) return;\n    isRenderingHL = true;\n    try {\n      const editor = $('code-editor');\n      const hl = $('code-highlight');\n      if (!editor || !hl) return;\n      let html = highlightSyntax(editor.value, activeModule);\n      const query = $('find-input') ? $('find-input').value : '';\n      if (query) html = applySearchHighlightToLayer(html, query);\n      hl.innerHTML = html;\n      hl.scrollTop = editor.scrollTop;\n      hl.scrollLeft = editor.scrollLeft;\n    } finally {\n      isRenderingHL = false;\n    }\n  }, 40);\n}\n\nfunction updateUndoRedoBadges(){\n  $('undo-count').textContent = undoStack[activeModule] ? undoStack[activeModule].length : 0;\n  $('redo-count').textContent = redoStack[activeModule] ? redoStack[activeModule].length : 0;\n}\n\n/* ============ SPLITTER ============ */\nfunction processAutoSplit(rawHtml){\n  savedDocMeta = { doctype:'\u003c!DOCTYPE html>', htmlAttrs:'', bodyAttrs:'' };\n  savedScriptAttrs = [];\n  savedCssStyles = [];\n\n  try {\n    const parser = new DOMParser();\n    const doc = parser.parseFromString(rawHtml, 'text/html');\n\n    const doctypeMatch = rawHtml.match(/^\\s*\u003c!DOCTYPE[^>]*>/i);\n    savedDocMeta.doctype = doctypeMatch ? doctypeMatch[0] : '\u003c!DOCTYPE html>';\n\n    if (doc.documentElement) {\n      for (const a of doc.documentElement.attributes) savedDocMeta.htmlAttrs += ` ${a.name}=\"${a.value}\"`;\n    }\n    if (doc.body) {\n      for (const a of doc.body.attributes) savedDocMeta.bodyAttrs += ` ${a.name}=\"${a.value}\"`;\n    }\n\n    const cssBlocks = [];\n    doc.querySelectorAll('style').forEach(styleEl => {\n      if (styleEl.closest('noscript')) return;\n      const media = styleEl.getAttribute('media') || '';\n      const attrs = Array.from(styleEl.attributes).filter(a => a.name !== 'media')\n        .map(a => `${a.name}=\"${a.value}\"`).join(' ');\n      cssBlocks.push({ media, attrs, code: styleEl.innerHTML });\n      styleEl.remove();\n    });\n\n    const jsBlocks = [];\n    doc.querySelectorAll('script').forEach(scriptEl => {\n      if (scriptEl.closest('noscript')) return;\n      const attrs = {};\n      for (const a of scriptEl.attributes) attrs[a.name] = a.value;\n      jsBlocks.push({ attrs, code: scriptEl.innerHTML });\n      scriptEl.remove();\n    });\n\n    const cssText = cssBlocks.map(b => {\n      if (b.media) return `@media ${b.media} {\\n${b.code}\\n}`;\n      return b.code;\n    }).join('\\n\\n/* --- Next Style --- */\\n\\n');\n\n    const jsText = jsBlocks.map(b => b.code).join('\\n\\n// --- Next Script ---\\n\\n');\n\n    savedCssStyles = cssBlocks.map(b => ({ media: b.media, attrs: b.attrs }));\n    savedScriptAttrs = jsBlocks.map(b => b.attrs);\n\n    return {\n      success: true,\n      head: doc.head ? doc.head.innerHTML.trim() : '',\n      css: cssText.trim(),\n      html: doc.body ? doc.body.innerHTML.trim() : '',\n      js: jsText.trim()\n    };\n  } catch(err){\n    console.error('Split error:', err);\n    return { success:false, head:'', css:'', html: rawHtml, js:'' };\n  }\n}\n\n/* ============ MERGER ============ */\nfunction buildMergedHTML(withInterceptor){\n  if (!currentProject) return '';\n  const { head, css, html, js } = currentProject.modules;\n  const CLOSE_SCRIPT = '\u003c/' + 'script>';\n\n  let cssOut = '';\n  const cssSplits = css.trim() ? css.split(/\\n*\\/\\* --- Next Style --- \\*\\/\\n*/) : [];\n  while (savedCssStyles.length \u003c cssSplits.length) {\n    savedCssStyles.push({ media:'', attrs:'' });\n  }\n  if (savedCssStyles.length > cssSplits.length) {\n    savedCssStyles = savedCssStyles.slice(0, cssSplits.length);\n  }\n  if (cssSplits.length > 0 && css.trim()) {\n    cssSplits.forEach((code, i) => {\n      const meta = savedCssStyles[i] || { media:'', attrs:'' };\n      const attrsStr = meta.attrs ? ' ' + meta.attrs : '';\n      cssOut += `\u003cstyle${attrsStr}>\\n${code}\\n\u003c/style>\\n`;\n    });\n  }\n\n  let jsOut = '';\n  const safeJs = js.replace(/\u003c\\/script>/gi, '\u003c\\\\/script>');\n  const jsSplits = safeJs.trim() ? safeJs.split(/\\n*\\/\\/ --- Next Script ---\\n*/) : [];\n  while (savedScriptAttrs.length \u003c jsSplits.length) {\n    savedScriptAttrs.push({});\n  }\n  if (savedScriptAttrs.length > jsSplits.length) {\n    savedScriptAttrs = savedScriptAttrs.slice(0, jsSplits.length);\n  }\n  jsSplits.forEach((code, i) => {\n    const attrs = savedScriptAttrs[i] || {};\n    // FIX 1: keep boolean attrs even when empty\n    const attrStr = Object.entries(attrs)\n      .filter(([k,v]) => BOOL_ATTRS.has(k) ? true : (v !== undefined && v !== null && String(v).length > 0))\n      .map(([k,v]) => {\n        if (BOOL_ATTRS.has(k) && (v === '' || v === null || v === undefined)) return k;\n        return `${k}=\"${String(v).replace(/\"/g, '&quot;')}\"`;\n      })\n      .join(' ');\n    jsOut += `\u003cscript${attrStr ? ' ' + attrStr : ''}>\\n${code}\\n${CLOSE_SCRIPT}\\n`;\n  });\n\n  const interceptor = withInterceptor ? `\u003cscript>\n(function(){\n  function safeStr(a){\n    if (a === null || a === undefined) return String(a);\n    if (typeof a === 'object') {\n      try { return JSON.stringify(a); } catch(e){ return '[Object]'; }\n    }\n    return String(a);\n  }\n  function send(type, args){\n    try {\n      parent.postMessage({source:'ai-studio-console', type:type,\n        msg: Array.prototype.slice.call(args).map(safeStr).join(' ')}, '*');\n    } catch(e){}\n  }\n  ['log','warn','error','info'].forEach(function(t){\n    var orig = console[t];\n    console[t] = function(){ send(t, arguments); orig.apply(console, arguments); };\n  });\n  window.onerror = function(m,u,l){ send('error',[m + (l ? ' (Line ' + l + ')' : '')]); };\n  window.addEventListener('unhandledrejection', function(e){\n    send('error', ['Unhandled: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)]);\n  });\n})();\n${CLOSE_SCRIPT}` : '';\n\n  return `${savedDocMeta.doctype}\n\u003chtml${savedDocMeta.htmlAttrs}>\n\u003chead>\n${head}\n${interceptor}\n${cssOut}\u003c/head>\n\u003cbody${savedDocMeta.bodyAttrs}>\n${html}\n${jsOut}\u003c/body>\n\u003c/html>`;\n}\n\n/* ============ PROJECT ============ */\nfunction renderProjectList(){\n  const listEl = $('project-list');\n  $('project-count').textContent = projects.length;\n  if (projects.length === 0) {\n    listEl.innerHTML = '\u003cdiv style=\"text-align:center;padding:30px;color:var(--text-muted);font-size:.9rem;\">No projects found.\u003c/div>';\n    return;\n  }\n  listEl.innerHTML = projects.map(p => `\n    \u003cdiv class=\"project-item\">\n      \u003cdiv class=\"project-info\" onclick=\"openProject('${p.id}')\">\n        \u003cdiv class=\"project-name\">${escapeHtml(p.name)}\u003c/div>\n        \u003cdiv class=\"project-meta\">${new Date(p.updatedAt).toLocaleString()}\u003c/div>\n      \u003c/div>\n      \u003cdiv class=\"project-actions\">\n        \u003cbutton class=\"icon-btn-sm\" onclick=\"openProject('${p.id}')\">✏️\u003c/button>\n        \u003cbutton class=\"icon-btn-sm del\" onclick=\"deleteProject('${p.id}')\">🗑️\u003c/button>\n      \u003c/div>\n    \u003c/div>`).join('');\n}\n\nfunction createProjectObject(name, rawHtml){\n  const split = processAutoSplit(rawHtml);\n  const proj = {\n    id: 'proj_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),\n    name: name || 'New App',\n    updatedAt: Date.now(),\n    lastModule: 'html',\n    modules: { head: split.head, css: split.css, html: split.html, js: split.js },\n    meta: {\n      doctype: savedDocMeta.doctype,\n      htmlAttrs: savedDocMeta.htmlAttrs,\n      bodyAttrs: savedDocMeta.bodyAttrs,\n      cssStyles: JSON.parse(JSON.stringify(savedCssStyles)),\n      scriptAttrs: JSON.parse(JSON.stringify(savedScriptAttrs))\n    },\n    history: [{\n      timestamp: Date.now(), label: 'Initial Import',\n      modules: { head: split.head, css: split.css, html: split.html, js: split.js }\n    }]\n  };\n  projects.unshift(proj);\n  saveProjectsToStorage();\n  return proj;\n}\n\nfunction triggerFileImport(){ $('html-file-input').click(); }\nfunction handleHtmlFileUpload(e){\n  const file = e.target.files[0];\n  if (!file) return;\n  const reader = new FileReader();\n  reader.onload = evt => {\n    const cleanName = file.name.replace(/\\.(html|htm|txt)$/i, '');\n    const proj = createProjectObject(cleanName, evt.target.result);\n    renderProjectList();\n    openProject(proj.id);\n    showToast('File imported successfully!');\n  };\n  reader.onerror = () => showToast('Error reading file');\n  reader.readAsText(file);\n  e.target.value = '';\n}\nfunction openPasteFullModal(){\n  $('new-proj-name').value = '';\n  $('full-html-paste-area').value = '';\n  openModal('modal-paste-full');\n}\nfunction importFromPastedFullHtml(){\n  const raw = $('full-html-paste-area').value.trim();\n  if (!raw) { showToast('Please enter code'); return; }\n  const name = $('new-proj-name').value.trim() || 'Pasted App';\n  const proj = createProjectObject(name, raw);\n  closeModal('modal-paste-full');\n  renderProjectList();\n  openProject(proj.id);\n  showToast('Code split successfully!');\n}\nfunction createBlankProject(){\n  const starter = `\u003c!DOCTYPE html>\\n\u003chtml>\\n\u003chead>\\n  \u003cmeta charset=\"UTF-8\">\\n  \u003ctitle>My App\u003c/title>\\n\u003c/head>\\n\u003cbody>\\n  \u003ch1>Hello World\u003c/h1>\\n\u003c/body>\\n\u003c/html>`;\n  const proj = createProjectObject('New Blank App', starter);\n  renderProjectList();\n  openProject(proj.id);\n}\n\nfunction openProject(id){\n  const found = projects.find(p => p.id === id);\n  if (!found) return;\n  currentProject = found;\n  if (found.meta) {\n    savedDocMeta = {\n      doctype: found.meta.doctype || '\u003c!DOCTYPE html>',\n      htmlAttrs: found.meta.htmlAttrs || '',\n      bodyAttrs: found.meta.bodyAttrs || ''\n    };\n    savedCssStyles = JSON.parse(JSON.stringify(found.meta.cssStyles || []));\n    savedScriptAttrs = JSON.parse(JSON.stringify(found.meta.scriptAttrs || []));\n  }\n  undoStack = { head:[], css:[], html:[], js:[] };\n  redoStack = { head:[], css:[], html:[], js:[] };\n  $('editor-proj-name').value = currentProject.name;\n  activeModule = found.lastModule && found.modules[found.lastModule] !== undefined ? found.lastModule : 'html';\n  switchView('view-editor');\n  $('code-editor').value = currentProject.modules[activeModule] || '';\n  document.querySelectorAll('.tab-pill').forEach(b => b.classList.toggle('active', b.dataset.mod === activeModule));\n  const lbl = activeModule.toUpperCase();\n  $('lbl-mod-copy').textContent = lbl;\n  $('lbl-mod-rep').textContent = lbl;\n  updateLineNumbers();\n  renderEditorSyntax();\n  updateUndoRedoBadges();\n  refreshSearchMatches();\n  lastSavedSnapshot = { module: activeModule, code: $('code-editor').value };\n  // FIX 8: lazy render - only set srcdoc if runner visible\n  if ($('view-runner').classList.contains('active')) {\n    $('preview-frame').srcdoc = buildMergedHTML(true);\n  }\n}\n\nfunction deleteProject(id){\n  if (!confirm('Are you sure you want to delete this project?')) return;\n  projects = projects.filter(p => p.id !== id);\n  saveProjectsToStorage();\n  renderProjectList();\n  showToast('Project deleted');\n}\nfunction renameCurrentProject(newName){\n  if (!currentProject) return;\n  currentProject.name = newName.trim() || 'Untitled App';\n  autoSaveSilent();\n}\nfunction saveCurrentProject(createSnapshot){\n  if (!currentProject) return;\n  currentProject.modules[activeModule] = $('code-editor').value;\n  currentProject.updatedAt = Date.now();\n  currentProject.lastModule = activeModule;\n  currentProject.meta = {\n    doctype: savedDocMeta.doctype,\n    htmlAttrs: savedDocMeta.htmlAttrs,\n    bodyAttrs: savedDocMeta.bodyAttrs,\n    cssStyles: JSON.parse(JSON.stringify(savedCssStyles)),\n    scriptAttrs: JSON.parse(JSON.stringify(savedScriptAttrs))\n  };\n  if (createSnapshot) {\n    // FIX 4: push history BEFORE updating lastSavedSnapshot\n    pushHistorySnapshot('Manual Save');\n    showToast('Saved successfully! ✅');\n    lastSavedSnapshot = { module: activeModule, code: $('code-editor').value };\n  }\n  saveProjectsToStorage();\n}\nfunction autoSaveSilent(){\n  if (!currentProject) return;\n  if (autoSaveDebounceTimer) clearTimeout(autoSaveDebounceTimer);\n  autoSaveDebounceTimer = setTimeout(() => {\n    currentProject.updatedAt = Date.now();\n    currentProject.lastModule = activeModule;\n    currentProject.meta = {\n      doctype: savedDocMeta.doctype,\n      htmlAttrs: savedDocMeta.htmlAttrs,\n      bodyAttrs: savedDocMeta.bodyAttrs,\n      cssStyles: JSON.parse(JSON.stringify(savedCssStyles)),\n      scriptAttrs: JSON.parse(JSON.stringify(savedScriptAttrs))\n    };\n    saveProjectsToStorage();\n  }, 700);\n}\n\n/* ============ EDITOR ============ */\nfunction switchModule(mod){\n  if (!currentProject) return;\n  const editor = $('code-editor');\n  if (activeModule && currentProject.modules[activeModule] !== undefined) {\n    currentProject.modules[activeModule] = editor.value;\n  }\n  activeModule = mod;\n  currentProject.lastModule = mod;\n  document.querySelectorAll('.tab-pill').forEach(btn => btn.classList.toggle('active', btn.dataset.mod === mod));\n  const labelMap = { head:'HEAD', css:'CSS', html:'HTML', js:'JS' };\n  $('lbl-mod-copy').textContent = labelMap[mod];\n  $('lbl-mod-rep').textContent = labelMap[mod];\n  editor.value = currentProject.modules[mod] || '';\n  editor.scrollTop = 0;\n  editor.scrollLeft = 0;\n  updateLineNumbers();\n  renderEditorSyntax();\n  updateUndoRedoBadges();\n  refreshSearchMatches();\n  lastSavedSnapshot = { module: mod, code: editor.value };\n  if ($('auto-run-chk').checked) runCode(false);\n}\nfunction updateLineNumbers(){\n  const editor = $('code-editor');\n  const lines = editor.value.split('\\n').length;\n  let nums = '';\n  for (let i = 1; i \u003c= lines; i++) nums += i + '\\n';\n  $('line-numbers').textContent = nums;\n}\n\nfunction pushUndoState(){\n  if (!currentProject) return;\n  const val = $('code-editor').value;\n  const stack = undoStack[activeModule];\n  if (stack.length > 0 && stack[stack.length - 1] === val) return;\n  stack.push(val);\n  if (stack.length > 35) stack.shift();\n  redoStack[activeModule] = [];\n  updateUndoRedoBadges();\n}\n\n// FIX 4: central mutation helper - ALWAYS pushes undo\nfunction mutateEditor(newValue, opts){\n  const editor = $('code-editor');\n  pushUndoState();\n  editor.value = newValue;\n  if (currentProject) currentProject.modules[activeModule] = newValue;\n  if (opts && opts.selectionStart !== undefined && opts.selectionEnd !== undefined) {\n    editor.setSelectionRange(opts.selectionStart, opts.selectionEnd);\n  }\n  updateLineNumbers();\n  renderEditorSyntax();\n  autoSaveSilent();\n  refreshSearchMatches();\n  if ($('auto-run-chk').checked) runCode(false);\n}\n\nfunction editorUndo(){\n  if (!currentProject) return;\n  if (undoStack[activeModule].length === 0) { showToast('No more undo'); return; }\n  const editor = $('code-editor');\n  redoStack[activeModule].push(editor.value);\n  const prev = undoStack[activeModule].pop();\n  editor.value = prev;\n  currentProject.modules[activeModule] = prev;\n  updateLineNumbers();\n  renderEditorSyntax();\n  updateUndoRedoBadges();\n  autoSaveSilent();\n  refreshSearchMatches();\n  if ($('auto-run-chk').checked) runCode(false);\n}\nfunction editorRedo(){\n  if (!currentProject) return;\n  if (redoStack[activeModule].length === 0) { showToast('No more redo'); return; }\n  const editor = $('code-editor');\n  undoStack[activeModule].push(editor.value);\n  const next = redoStack[activeModule].pop();\n  editor.value = next;\n  currentProject.modules[activeModule] = next;\n  updateLineNumbers();\n  renderEditorSyntax();\n  updateUndoRedoBadges();\n  autoSaveSilent();\n  refreshSearchMatches();\n  if ($('auto-run-chk').checked) runCode(false);\n}\n\nfunction formatCurrentModule(){\n  if (!currentProject) return;\n  const editor = $('code-editor');\n  let cleaned;\n  if (activeModule === 'js' || activeModule === 'css') {\n    cleaned = editor.value.split('\\n').map(l => l.replace(/\\s+$/,'')).join('\\n').replace(/\\n{3,}/g,'\\n\\n');\n  } else {\n    cleaned = editor.value.replace(/\\s+$/,'') + '\\n';\n  }\n  mutateEditor(cleaned);\n  showToast('Code cleaned & formatted ✨');\n}\nfunction insertColor(hex){\n  if (!currentProject) return;\n  const editor = $('code-editor');\n  const start = editor.selectionStart, end = editor.selectionEnd;\n  const newVal = editor.value.substring(0, start) + hex + editor.value.substring(end);\n  mutateEditor(newVal, { selectionStart: start + hex.length, selectionEnd: start + hex.length });\n  editor.focus();\n  showToast('Color inserted: ' + hex);\n}\n\n/* ============ ADVANCED SEARCH ============ */\nfunction toggleSearchPanel(){\n  const panel = $('search-panel');\n  const btn = $('search-toggle-btn');\n  const isOpen = panel.classList.toggle('open');\n  btn.classList.toggle('active', isOpen);\n  if (isOpen) { refreshSearchMatches(); setTimeout(() => $('find-input').focus(), 100); }\n}\n\nfunction debouncedRefreshMatches(){\n  if (searchDebounceTimer) clearTimeout(searchDebounceTimer);\n  searchDebounceTimer = setTimeout(refreshSearchMatches, 300);\n}\n\nfunction refreshSearchMatches(){\n  const query = $('find-input').value;\n  const listEl = $('match-list');\n  matchList = [];\n  activeMatchIndex = -1;\n  if (!query || !currentProject) {\n    listEl.innerHTML = '';\n    listEl.classList.remove('open');\n    renderEditorSyntax();\n    return;\n  }\n  const text = $('code-editor').value;\n  let idx = 0;\n  while ((idx = text.indexOf(query, idx)) !== -1) {\n    const line = text.substring(0, idx).split('\\n').length;\n    matchList.push({ start: idx, end: idx + query.length, line });\n    idx += query.length || 1;\n    if (matchList.length > 500) break;\n  }\n  renderMatchList();\n  renderEditorSyntax();\n  renderSearchHighlights();\n}\n\nfunction renderMatchList(){\n  const listEl = $('match-list');\n  if (matchList.length === 0) {\n    listEl.innerHTML = '\u003cdiv class=\"match-count-banner\">\u003cspan>No matches found\u003c/span>\u003c/div>';\n    listEl.classList.add('open');\n    return;\n  }\n  const text = $('code-editor').value;\n  let html = `\u003cdiv class=\"match-count-banner\">\u003cspan>\u003cstrong>${matchList.length}\u003c/strong> match${matchList.length===1?'':'es'} found\u003c/span>\u003cbutton class=\"match-mini-btn\" onclick=\"replaceAllInModule()\">Replace All\u003c/button>\u003c/div>`;\n  matchList.forEach((m, i) => {\n    const lineStart = text.lastIndexOf('\\n', m.start - 1) + 1;\n    const lineEnd = text.indexOf('\\n', m.end);\n    const lineText = text.substring(lineStart, lineEnd === -1 ? text.length : lineEnd);\n    const isActive = i === activeMatchIndex ? ' active' : '';\n    html += `\n      \u003cdiv class=\"match-card${isActive}\" data-match-idx=\"${i}\">\n        \u003cdiv class=\"match-head\">\n          \u003cspan class=\"match-line-badge\">📍 Line ${m.line}\u003c/span>\n          \u003cdiv class=\"match-actions\">\n            \u003cbutton class=\"match-mini-btn go\" onclick=\"jumpToMatch(${i})\">Go\u003c/button>\n            \u003cbutton class=\"match-mini-btn cp\" onclick=\"copyMatchContext(${i})\">Copy Line\u003c/button>\n            \u003cbutton class=\"match-mini-btn rp\" onclick=\"replaceSingleMatch(${i})\">Replace\u003c/button>\n            \u003cbutton class=\"match-mini-btn dl\" onclick=\"deleteSingleMatch(${i})\">Delete\u003c/button>\n          \u003c/div>\n        \u003c/div>\n        \u003cdiv class=\"match-preview\">${escapeHtml(lineText)}\u003c/div>\n        \u003cdiv class=\"match-replace-row\">\n          \u003cinput type=\"text\" class=\"match-replace-input\" id=\"match-rep-${i}\" placeholder=\"Replace with...\" value=\"${escapeHtml($('replace-input').value)}\">\n        \u003c/div>\n      \u003c/div>`;\n  });\n  listEl.innerHTML = html;\n  listEl.classList.add('open');\n}\n\nfunction renderSearchHighlights(){\n  if (activeMatchIndex >= 0 && matchList[activeMatchIndex]) {\n    const editor = $('code-editor');\n    const m = matchList[activeMatchIndex];\n    editor.focus();\n    editor.setSelectionRange(m.start, m.end);\n    const linesBefore = editor.value.substring(0, m.start).split('\\n').length;\n    editor.scrollTop = Math.max(0, (linesBefore - 5) * 20);\n  }\n}\n\nfunction toggleMatchList(){\n  const listEl = $('match-list');\n  if (!listEl.classList.contains('open')) {\n    refreshSearchMatches();\n  } else {\n    listEl.classList.toggle('open');\n  }\n}\n\nfunction findNext(){\n  const query = $('find-input').value;\n  if (!query) { showToast('Enter text to find'); refreshSearchMatches(); return; }\n  if (matchList.length === 0) refreshSearchMatches();\n  if (matchList.length === 0) { showToast('Result not found'); return; }\n  const editor = $('code-editor');\n  const cursor = editor.selectionEnd;\n  let nextIdx = matchList.findIndex(m => m.start >= cursor);\n  if (nextIdx === -1) nextIdx = 0;\n  activeMatchIndex = nextIdx;\n  renderMatchList();\n  renderEditorSyntax();\n  renderSearchHighlights();\n  showToast(`Match ${nextIdx + 1} of ${matchList.length} (Line ${matchList[nextIdx].line})`);\n}\n\nfunction jumpToMatch(i){\n  if (!matchList[i]) return;\n  activeMatchIndex = i;\n  const editor = $('code-editor');\n  const m = matchList[i];\n  editor.focus();\n  editor.setSelectionRange(m.start, m.end);\n  const linesBefore = editor.value.substring(0, m.start).split('\\n').length;\n  editor.scrollTop = Math.max(0, (linesBefore - 5) * 20);\n  renderMatchList();\n  renderEditorSyntax();\n}\n\nasync function copyMatchContext(i){\n  if (!matchList[i]) return;\n  const text = $('code-editor').value;\n  const m = matchList[i];\n  const lineStart = text.lastIndexOf('\\n', m.start - 1) + 1;\n  const lineEnd = text.indexOf('\\n', m.end);\n  const lineText = text.substring(lineStart, lineEnd === -1 ? text.length : lineEnd);\n  try {\n    await navigator.clipboard.writeText(lineText);\n    showToast('Line ' + m.line + ' copied 📋');\n  } catch(e){\n    showToast('Copy failed');\n  }\n}\n\nfunction replaceSingleMatch(i){\n  if (!matchList[i] || !currentProject) return;\n  const rep = $('match-rep-' + i) ? $('match-rep-' + i).value : $('replace-input').value;\n  const editor = $('code-editor');\n  const m = matchList[i];\n  const newVal = editor.value.substring(0, m.start) + rep + editor.value.substring(m.end);\n  mutateEditor(newVal);\n  showToast('Match replaced ✅');\n}\n\nfunction deleteSingleMatch(i){\n  if (!matchList[i] || !currentProject) return;\n  const editor = $('code-editor');\n  const m = matchList[i];\n  const newVal = editor.value.substring(0, m.start) + editor.value.substring(m.end);\n  mutateEditor(newVal);\n  showToast('Match deleted 🗑️');\n}\n\nfunction replaceAllInModule(){\n  const query = $('find-input').value;\n  const rep = $('replace-input').value;\n  if (!query) { showToast('Enter text to find'); return; }\n  const editor = $('code-editor');\n  if (!editor.value.includes(query)) { showToast('Match not found'); return; }\n  const newVal = editor.value.split(query).join(rep);\n  mutateEditor(newVal);\n  showToast('Replaced all matches ✅');\n}\n\nfunction openExpandedSearchModal(){\n  $('big-search-mod').textContent = activeModule.toUpperCase();\n  $('big-find-area').value = $('find-input').value;\n  $('big-replace-area').value = $('replace-input').value;\n  $('big-search-info').textContent = '';\n  openModal('modal-big-search');\n}\nfunction closeExpandedSearchModal(){\n  $('find-input').value = $('big-find-area').value;\n  $('replace-input').value = $('big-replace-area').value;\n  refreshSearchMatches();\n  closeModal('modal-big-search');\n}\nfunction previewBigSearchMatches(){\n  const query = $('big-find-area').value;\n  if (!query) { $('big-search-info').textContent = '⚠️ Find field is empty'; return; }\n  const text = $('code-editor').value;\n  const matches = [];\n  let idx = 0;\n  while ((idx = text.indexOf(query, idx)) !== -1) {\n    const line = text.substring(0, idx).split('\\n').length;\n    matches.push({ start: idx, line });\n    idx += query.length || 1;\n    if (matches.length > 200) break;\n  }\n  if (matches.length === 0) {\n    $('big-search-info').innerHTML = '\u003cspan style=\"color:var(--danger)\">❌ No matches found for the multi-line text.\u003c/span>';\n  } else {\n    $('big-search-info').innerHTML = `\u003cspan style=\"color:var(--accent-green)\">✅ Found \u003cstrong>${matches.length}\u003c/strong> match(es). First at line ${matches[0].line}.\u003c/span>`;\n  }\n}\nfunction applyExpandedReplace(){\n  const query = $('big-find-area').value;\n  const rep = $('big-replace-area').value;\n  if (!query) { showToast('Find field is empty'); return; }\n  const editor = $('code-editor');\n  if (!editor.value.includes(query)) {\n    showToast('Multi-line match not found');\n    return;\n  }\n  const newVal = editor.value.split(query).join(rep);\n  mutateEditor(newVal);\n  $('find-input').value = query;\n  $('replace-input').value = rep;\n  closeModal('modal-big-search');\n  showToast('Multi-line code replaced! ✅');\n}\n\nasync function copyCurrentModule(){\n  const editor = $('code-editor');\n  const code = editor.value;\n  const selStart = editor.selectionStart, selEnd = editor.selectionEnd;\n  try {\n    await navigator.clipboard.writeText(code);\n    showToast(activeModule.toUpperCase() + ' part copied! 📋');\n  } catch(e){\n    editor.select();\n    try { document.execCommand('copy'); showToast('Copied!'); }\n    catch(err){ showToast('Copy failed'); }\n    editor.setSelectionRange(selStart, selEnd);\n  }\n}\n\nfunction openModuleReplaceModal(){\n  $('modal-mod-title').textContent = activeModule.toUpperCase();\n  $('module-replace-area').value = '';\n  openModal('modal-replace-mod');\n}\nfunction cleanTagsIfNeeded(id, code){\n  let trimmed = code.trim();\n  if (id === 'css' && /\u003cstyle\\b/i.test(trimmed)) {\n    const doc = new DOMParser().parseFromString(trimmed, 'text/html');\n    const styles = doc.querySelectorAll('style');\n    if (styles.length >= 1) trimmed = Array.from(styles).map(s => s.innerHTML).join('\\n\\n/* --- Next Style --- */\\n\\n');\n  } else if (id === 'js' && /\u003cscript\\b/i.test(trimmed)) {\n    const doc = new DOMParser().parseFromString(trimmed, 'text/html');\n    const scripts = doc.querySelectorAll('script');\n    if (scripts.length >= 1) trimmed = Array.from(scripts).filter(s => !s.src).map(s => s.innerHTML).join('\\n\\n// --- Next Script ---\\n\\n');\n  }\n  return trimmed.trim();\n}\nfunction applyModuleReplacement(){\n  let newCode = $('module-replace-area').value;\n  if (!newCode.trim()) { showToast('New code is empty'); return; }\n  newCode = cleanTagsIfNeeded(activeModule, newCode);\n  pushHistorySnapshot('Before ' + activeModule.toUpperCase() + ' Replace');\n  mutateEditor(newCode);\n  saveCurrentProject(false);\n  closeModal('modal-replace-mod');\n  showToast(activeModule.toUpperCase() + ' part updated! ✅');\n}\nfunction pushHistorySnapshot(label){\n  if (!currentProject) return;\n  if (!currentProject.history) currentProject.history = [];\n  currentProject.history.unshift({\n    timestamp: Date.now(), label,\n    modules: JSON.parse(JSON.stringify(currentProject.modules))\n  });\n  if (currentProject.history.length > 15) currentProject.history.pop();\n}\nfunction openHistoryModal(){\n  const list = $('history-list');\n  const hist = currentProject && currentProject.history ? currentProject.history : [];\n  if (hist.length === 0) list.innerHTML = '\u003cp style=\"color:var(--text-muted)\">No history versions.\u003c/p>';\n  else list.innerHTML = hist.map((h,i) => `\n    \u003cdiv class=\"project-item\">\n      \u003cdiv style=\"min-width:0\">\n        \u003cdiv class=\"project-name\" style=\"font-size:.9rem;\">${escapeHtml(h.label)}\u003c/div>\n        \u003cdiv class=\"project-meta\">${new Date(h.timestamp).toLocaleString()}\u003c/div>\n      \u003c/div>\n      \u003cbutton class=\"ai-btn replace\" onclick=\"restoreHistoryIndex(${i})\">Restore\u003c/button>\n    \u003c/div>`).join('');\n  openModal('modal-history');\n}\nfunction restoreHistoryIndex(idx){\n  if (!currentProject || !currentProject.history || !currentProject.history[idx]) return;\n  const snap = currentProject.history[idx];\n  currentProject.modules = JSON.parse(JSON.stringify(snap.modules));\n  $('code-editor').value = currentProject.modules[activeModule] || '';\n  updateLineNumbers();\n  renderEditorSyntax();\n  saveCurrentProject(false);\n  refreshSearchMatches();\n  lastSavedSnapshot = { module: activeModule, code: $('code-editor').value };\n  if ($('view-runner').classList.contains('active')) {\n    $('preview-frame').srcdoc = buildMergedHTML(true);\n  }\n  closeModal('modal-history');\n  showToast('Version restored! 🕒');\n}\n// FIX 4: Diff against LAST SAVE, not initial import\nfunction showDiffModal(){\n  if (!currentProject) return;\n  const baseline = lastSavedSnapshot && lastSavedSnapshot.module === activeModule\n    ? lastSavedSnapshot.code\n    : (currentProject.history && currentProject.history[0] ? currentProject.history[0].modules[activeModule] || '' : '');\n  if (baseline === '' && (!currentProject.history || currentProject.history.length === 0)) {\n    showToast('No previous version');\n    return;\n  }\n  const currCode = $('code-editor').value;\n  const oldLines = baseline.split('\\n');\n  const newLines = currCode.split('\\n');\n  let html = '';\n  const maxLen = Math.max(oldLines.length, newLines.length);\n  for (let i = 0; i \u003c maxLen; i++) {\n    const o = oldLines[i], n = newLines[i];\n    if (o === n) html += `\u003cdiv class=\"diff-eq\">  ${escapeHtml(n || '')}\u003c/div>`;\n    else {\n      if (o !== undefined) html += `\u003cspan class=\"diff-rem\">- ${escapeHtml(o)}\u003c/span>`;\n      if (n !== undefined) html += `\u003cspan class=\"diff-add\">+ ${escapeHtml(n)}\u003c/span>`;\n    }\n  }\n  $('diff-output').innerHTML = html || 'No changes.';\n  openModal('modal-diff');\n}\n\n/* ============ RUNNER ============ */\nfunction runCode(force){\n  if (!force && !$('auto-run-chk').checked) return;\n  if (!currentProject) { if (force) showToast('Please open a project first'); return; }\n  currentProject.modules[activeModule] = $('code-editor').value;\n  saveCurrentProject(false);\n  $('preview-frame').srcdoc = buildMergedHTML(true);\n  if (force) switchView('view-runner');\n}\nwindow.addEventListener('message', e => {\n  if (e.data && e.data.source === 'ai-studio-console') appendConsoleMessage(e.data.type, e.data.msg);\n});\n\nfunction appendConsoleMessage(type, text){\n  const logsEl = $('console-logs');\n  const fullMsg = '[' + type.toUpperCase() + '] ' + text;\n  consoleMessagesList.push(fullMsg);\n  allLogsEver.push(fullMsg);   // FIX 7: persistent log\n\n  const line = document.createElement('div');\n  line.className = 'log-line ' + type;\n\n  const contentSpan = document.createEle
