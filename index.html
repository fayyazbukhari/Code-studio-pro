ment('span');\n  contentSpan.className = 'log-line-content';\n  contentSpan.textContent = fullMsg;\n\n  const copyBtn = document.createElement('button');\n  copyBtn.className = 'log-copy-btn';\n  copyBtn.textContent = 'Copy';\n  copyBtn.onclick = (e) => {\n    e.stopPropagation();\n    navigator.clipboard.writeText(fullMsg).then(() => {\n      showToast('Log copied! 📋');\n    }).catch(() => showToast('Copy failed'));\n  };\n\n  line.appendChild(contentSpan);\n  line.appendChild(copyBtn);\n  logsEl.appendChild(line);\n  logsEl.scrollTop = logsEl.scrollHeight;\n\n  if (type === 'error') { errCounter++; $('err-count').textContent = errCounter + ' Errors'; }\n  else if (type === 'warn') { warnCounter++; $('warn-count').textContent = warnCounter + ' Warnings'; }\n  else { logCounter++; $('log-count').textContent = logCounter + ' Logs'; }\n}\n\nasync function copyAllErrors(){\n  // FIX 7: use allLogsEver so cleared logs are still copyable\n  const source = allLogsEver.length ? allLogsEver : consoleMessagesList;\n  if (source.length === 0) {\n    showToast('No console messages to copy');\n    return;\n  }\n  const allText = source.join('\\n');\n  try {\n    await navigator.clipboard.writeText(allText);\n    showToast('All console messages copied! 📋');\n  } catch(err){\n    showToast('Copy failed');\n  }\n}\n\nfunction clearConsole(){\n  $('console-logs').innerHTML = '';\n  consoleMessagesList = [];\n  errCounter = warnCounter = logCounter = 0;\n  $('err-count').textContent = '0 Errors';\n  $('warn-count').textContent = '0 Warnings';\n  $('log-count').textContent = '0 Logs';\n}\nfunction toggleConsole(){ $('console-box').classList.toggle('collapsed'); }\nfunction backToEditor(){ $('preview-frame').srcdoc = ''; switchView('view-editor'); }\nfunction goDashboard(){\n  $('preview-frame').srcdoc = '';\n  saveCurrentProject(false);\n  renderProjectList();\n  switchView('view-dashboard');\n}\n\nfunction openExportModal(){\n  if (!currentProject) return;\n  currentProject.modules[activeModule] = $('code-editor').value;\n  openModal('modal-export');\n}\n// FIX 6: refresh doc meta from current content before export\nfunction refreshDocMetaFromContent(){\n  try {\n    // Re-split current merged HTML to update doc-level attributes from current modules\n    // But we don't want to overwrite modules. So we just re-parse current HTML module + head to capture html/body attrs if any.\n    const merged = buildMergedHTML(false);\n    const parser = new DOMParser();\n    const doc = parser.parseFromString(merged, 'text/html');\n    if (doc.documentElement) {\n      let a = '';\n      for (const at of doc.documentElement.attributes) a += ` ${at.name}=\"${at.value}\"`;\n      // Only update if user didn't override elsewhere; keep original\n      savedDocMeta.htmlAttrs = a;\n    }\n    if (doc.body) {\n      let a = '';\n      for (const at of doc.body.attributes) a += ` ${at.name}=\"${at.value}\"`;\n      savedDocMeta.bodyAttrs = a;\n    }\n  } catch(e){ console.warn('meta refresh failed', e); }\n}\nfunction downloadHTML(){\n  if (!currentProject) return;\n  refreshDocMetaFromContent();\n  const fullDoc = buildMergedHTML(false);\n  const blob = new Blob([fullDoc], { type:'text/html' });\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url;\n  a.download = (currentProject.name || 'app').replace(/\\s+/g,'_') + '.html';\n  document.body.appendChild(a);\n  a.click();\n  document.body.removeChild(a);\n  setTimeout(() => URL.revokeObjectURL(url), 5000);\n  closeModal('modal-export');\n  showToast('File downloaded ⬇️');\n}\nasync function copyCompleteHtml(){\n  if (!currentProject) return;\n  refreshDocMetaFromContent();\n  const fullDoc = buildMergedHTML(false);\n  try {\n    await navigator.clipboard.writeText(fullDoc);\n    closeModal('modal-export');\n    showToast('Full HTML copied! 📋');\n  } catch(e){\n    const ta = document.createElement('textarea');\n    ta.value = fullDoc; ta.style.position = 'fixed'; ta.style.opacity = '0';\n    document.body.appendChild(ta); ta.select();\n    try { document.execCommand('copy'); showToast('Copied!'); } catch(err){ showToast('Copy failed'); }\n    document.body.removeChild(ta);\n    closeModal('modal-export');\n  }\n}\nfunction openInNewTab(){\n  if (!currentProject) return;\n  refreshDocMetaFromContent();\n  const fullDoc = buildMergedHTML(false);\n  const blob = new Blob([fullDoc], { type:'text/html' });\n  const url = URL.createObjectURL(blob);\n  window.open(url, '_blank');\n  setTimeout(() => URL.revokeObjectURL(url), 60000);\n  closeModal('modal-export');\n}\nfunction exportAllBackup(){\n  const trimmed = projects.map(p => ({\n    ...p,\n    history: (p.history || []).slice(0, 3)\n  }));\n  const blob = new Blob([JSON.stringify(trimmed, null, 2)], { type:'application/json' });\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url;\n  a.download = 'AI_Code_Studio_Backup.json';\n  document.body.appendChild(a); a.click(); document.body.removeChild(a);\n  setTimeout(() => URL.revokeObjectURL(url), 5000);\n  showToast('Backup saved!');\n}\nfunction triggerBackupRestore(){ $('backup-file-input').click(); }\nfunction handleBackupUpload(e){\n  const file = e.target.files[0];\n  if (!file) return;\n  const reader = new FileReader();\n  reader.onload = evt => {\n    try {\n      const imported = JSON.parse(evt.target.result);\n      if (!Array.isArray(imported)) { alert('Invalid backup format'); return; }\n      projects = imported;\n      saveProjectsToStorage();\n      renderProjectList();\n      showToast('Backup restored! ✅');\n    } catch(err){ alert('Error parsing file: ' + err.message); }\n  };\n  reader.onerror = () => alert('Error reading file');\n  reader.readAsText(file);\n  e.target.value = '';\n}\n\n/* ============ INIT ============ */\ndocument.addEventListener('DOMContentLoaded', () => {\n  loadProjectsFromStorage();\n  renderProjectList();\n  const editor = $('code-editor');\n\n  // FIX 4: snapshot on any input-type change, with time-based throttling\n  editor.addEventListener('beforeinput', (e) => {\n    if (e.inputType === 'insertText' || e.inputType === 'deleteContentBackward' ||\n        e.inputType === 'insertFromPaste' || e.inputType === 'deleteByCut' ||\n        e.inputType === 'insertLineBreak' || e.inputType === 'deleteContentForward') {\n      const now = Date.now();\n      if (now - lastSnapshotTime > 800) {\n        pushUndoState();\n        lastSnapshotTime = now;\n      }\n    }\n  });\n  editor.addEventListener('paste', () => { pushUndoState(); lastSnapshotTime = Date.now(); });\n  editor.addEventListener('cut', () => { pushUndoState(); lastSnapshotTime = Date.now(); });\n  editor.addEventListener('drop', () => { pushUndoState(); lastSnapshotTime = Date.now(); });\n\n  editor.addEventListener('input', () => {\n    updateLineNumbers();\n    renderEditorSyntax();\n    if (currentProject) {\n      currentProject.modules[activeModule] = editor.value;\n      autoSaveSilent();\n      if ($('auto-run-chk').checked) {\n        clearTimeout(autoRunTimer);\n        autoRunTimer = setTimeout(() => runCode(false), 450);\n      }\n      if ($('search-panel').classList.contains('open') && $('find-input').value) {\n        debouncedRefreshMatches();\n      }\n    }\n  });\n\n  editor.addEventListener('scroll', () => {\n    $('line-numbers').scrollTop = editor.scrollTop;\n    const hl = $('code-highlight');\n    hl.scrollTop = editor.scrollTop;\n    hl.scrollLeft = editor.scrollLeft;\n  });\n  editor.addEventListener('wheel', () => {\n    $('line-numbers').scrollTop = editor.scrollTop;\n  }, { passive: true });\n\n  $('line-numbers').addEventListener('click', (e) => {\n    const ln = $('line-numbers');\n    const rect = ln.getBoundingClientRect();\n    const y = e.clientY - rect.top;\n    const lineHeight = 13 * 1.55;\n    const lineIndex = Math.floor((y + ln.scrollTop) / lineHeight);\n    if (lineIndex \u003c 0) return;\n    const text = editor.value;\n    const lines = text.split('\\n');\n    if (lineIndex >= lines.length) return;\n    let start = 0;\n    for (let i = 0; i \u003c lineIndex; i++) start += lines[i].length + 1;\n    const end = start + lines[lineIndex].length;\n    editor.focus();\n    editor.setSelectionRange(start, end);\n    editor.scrollTop = Math.max(0, (lineIndex - 5) * 20);\n    showToast('Line ' + (lineIndex + 1) + ' selected');\n  });\n\n  editor.addEventListener('keydown', e => {\n    if (e.key === 'Tab') {\n      e.preventDefault();\n      const s = editor.selectionStart, end = editor.selectionEnd;\n      const newVal = editor.value.substring(0, s) + '  ' + editor.value.substring(end);\n      mutateEditor(newVal, { selectionStart: s + 2, selectionEnd: s + 2 });\n    }\n    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveCurrentProject(true); }\n    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); toggleSearchPanel(); }\n    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); editorUndo(); }\n    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); editorRedo(); }\n  });\n\n  document.addEventListener('keydown', e => {\n    if (e.key === 'Escape') document.querySelectorAll('.modal-backdrop.open').forEach(m => m.classList.remove('open'));\n  });\n});\n\u003c/script>\n\u003c/body>\n\u003c/html>";

function toast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2300)}
function openDB(){
 return new Promise((resolve,reject)=>{
  const req=indexedDB.open('CodeLauncherDB');
  req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('tools'))d.createObjectStore('tools',{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains('scratchpad'))d.createObjectStore('scratchpad',{keyPath:'id'});};
  req.onsuccess=()=>{db=req.result;db.onversionchange=()=>db.close();resolve(db)};
  req.onerror=()=>reject(req.error||new Error('IndexedDB unavailable'));
  req.onblocked=()=>toast('Close another Code Studio Pro tab and reload');
 });
}
function store(name,mode,action){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(name,mode),os=tx.objectStore(name);let result;
  let req;
  try{req=action(os)}catch(e){reject(e);return}
  if(req){req.onsuccess=()=>result=req.result;req.onerror=()=>reject(req.error)}
  tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('Database transaction aborted'));
 });
}
async function allTools(){return store('tools','readonly',os=>os.getAll())}
async function getTool(id){return store('tools','readonly',os=>os.get(Number(id)))}
async function putTool(t){return store('tools','readwrite',os=>t.id?os.put(t):os.add(t))}
async function removeTool(id){return store('tools','readwrite',os=>os.delete(Number(id)))}
async function load(){
 try{await openDB();tools=await allTools();renderTools();const n=await store('scratchpad','readonly',os=>os.get(1));$('notes').value=n?.text||''}
 catch(e){toast('Local database error: '+e.message);$('empty').classList.remove('hidden')}
}
function renderTools(){
 const q=$('search').value.trim().toLocaleLowerCase();const list=tools.filter(t=>(t.name||'').toLocaleLowerCase().includes(q)||(t.desc||'').toLocaleLowerCase().includes(q));
 $('count').textContent=list.length;$('tools').replaceChildren();
 $('empty').classList.toggle('hidden',list.length>0);
 for(const t of list){
  const b=document.createElement('button');b.className='tool';b.type='button';
  const em=document.createElement('div');em.className='emoji';em.textContent=t.emoji||'🛠️';
  const name=document.createElement('strong');name.textContent=t.name||'Untitled';
  b.append(em,name);b.addEventListener('click',()=>showDetails(t.id));$('tools').append(b);
 }
}
function toggleSearch(){$('search').classList.toggle('hidden');if(!$('search').classList.contains('hidden'))$('search').focus()}
async function showDetails(id){const t=await getTool(id);if(!t)return;selectedId=id;$('detailName').textContent=t.name||'Untitled';$('detailDesc').textContent=t.desc||'No description';$('details').classList.remove('hidden')}
function closeDetails(){$('details').classList.add('hidden')}
function openAdd(){editingId=null;$('editorTitle').textContent='Add HTML Tool';$('toolName').value='';$('toolDesc').value='';$('toolCode').value='';$('toolEmoji').value='🛠️';$('editorModal').classList.remove('hidden')}
async function editSelected(){const t=await getTool(selectedId);if(!t)return;editingId=t.id;$('editorTitle').textContent='Edit HTML Tool';$('toolName').value=t.name||'';$('toolDesc').value=t.desc||'';$('toolCode').value=t.code||'';$('toolEmoji').value=t.emoji||'🛠️';$('toolColor').value=t.color||'purple';closeDetails();$('editorModal').classList.remove('hidden')}
function closeEditor(){$('editorModal').classList.add('hidden')}
async function saveTool(){
 const name=$('toolName').value.trim(),code=$('toolCode').value;
 if(!name||!code.trim()){toast('Enter a name and HTML code');return}
 try{const old=editingId?await getTool(editingId):null;const t={...(old||{}),name,desc:$('toolDesc').value.trim(),code,emoji:$('toolEmoji').value.trim()||'🛠️',color:$('toolColor').value,updatedAt:Date.now()};
 if(editingId)t.id=editingId;await putTool(t);tools=await allTools();renderTools();closeEditor();toast('Tool saved locally')}
 catch(e){toast('Save failed: '+e.message)}
}
async function deleteSelected(){if(!selectedId||!confirm('Delete this tool?'))return;await removeTool(selectedId);tools=await allTools();renderTools();closeDetails();toast('Tool deleted')}
async function runSelected(){const t=await getTool(selectedId);if(!t)return;closeDetails();$('runTitle').textContent=t.name||'HTML Tool';$('runner').classList.remove('hidden');$('toolFrame').srcdoc=t.code||''}
function closeRunner(){$('toolFrame').srcdoc='';$('runner').classList.add('hidden')}
function openImportMenu(){$('importModal').classList.remove('hidden')}
function closeImportMenu(){$('importModal').classList.add('hidden')}
function chooseImportFiles(){closeImportMenu();$('bulk').click()}
function chooseImportFolder(){closeImportMenu();$('bulkFolder').click()}
function readFileText(file){
 return new Promise((resolve,reject)=>{
  if(typeof file.text==='function'){file.text().then(resolve,reject);return}
  const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||''));reader.onerror=()=>reject(reader.error||new Error('Could not read file'));reader.readAsText(file);
 });
}
async function importFiles(e){
 const input=e.target, files=Array.from(input.files||[]);let ok=0,skipped=0;
 if(!files.length){input.value='';return}
 try{
  for(const f of files){
   if(!/\.html?$/i.test(f.name)){skipped++;continue}
   const code=await readFileText(f);
   if(!code.trim()){skipped++;continue}
   const relative=(f.webkitRelativePath||'').replace(/\\/g,'/');
   const base=f.name.replace(/\.[^.]+$/,'');
   const name=relative?relative.replace(/\.[^.]+$/,''):base;
   await putTool({name,desc:relative?'Imported from folder: '+relative:'',code,emoji:'🛠️',color:'blue',updatedAt:Date.now()});ok++;
  }
  tools=await allTools();renderTools();
  toast(ok+' HTML file(s) imported'+(skipped?' • '+skipped+' skipped':''));
 }catch(err){toast('Import stopped: '+(err.message||'Unknown error'))}
 finally{input.value=''}
}

async function exportBackup(){
 try{const data=await allTools();if(!data.length){toast('No tools to back up');return}downloadBlob(JSON.stringify(data,null,2),'CodeStudioPro_Backup_'+new Date().toISOString().slice(0,10)+'.json','application/json');}
 catch(e){toast('Backup failed: '+e.message)}
}
function downloadBlob(data,name,type){const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
async function restoreBackup(e){
 const f=e.target.files?.[0];if(!f)return;
 try{const arr=JSON.parse(await f.text());if(!Array.isArray(arr))throw Error('Invalid backup');for(const t of arr){if(!t||typeof t.code!=='string')continue;await putTool({name:String(t.name||'Imported tool'),desc:String(t.desc||''),code:t.code,emoji:t.emoji||'🛠️',color:t.color||'blue',updatedAt:Date.now()})}tools=await allTools();renderTools();toast('Backup restored')}
 catch(err){toast('Restore failed: '+err.message)}finally{e.target.value=''}
}
let noteTimer;
function openNotes(){$('notesModal').classList.remove('hidden');$('notes').focus()}
function closeNotes(){$('notesModal').classList.add('hidden')}
async function saveNotes(){clearTimeout(noteTimer);const text=$('notes').value;noteTimer=setTimeout(async()=>{try{await store('scratchpad','readwrite',os=>os.put({id:1,text}))}catch(e){toast('Note save failed')}} ,250)}
function downloadNotes(){const v=$('notes').value;if(!v.trim()){toast('Notepad is empty');return}downloadBlob(v,'CodeStudioPro_Note_'+new Date().toISOString().slice(0,10)+'.txt','text/plain;charset=utf-8')}
function openStudio(){
 $('studioHost').classList.remove('hidden');
 // srcdoc is same-origin and self-contained: Code Studio projects remain in localStorage.
 if(!$('studioFrame').srcdoc)$('studioFrame').srcdoc=STUDIO_HTML;
}
function closeStudio(){
 try{$('studioFrame').contentWindow.postMessage({type:'code-studio-pro-parent-hide'},'*')}catch(e){}
 $('studioHost').classList.add('hidden');
}
window.addEventListener('beforeunload',()=>{try{db?.close()}catch(e){}});
load();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
 navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('Offline worker registration failed',err));
}
</script>
